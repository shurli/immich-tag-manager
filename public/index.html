<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Immich Tag Manager</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>Immich</strong><span>Tag Manager</span><span id="appVersion" class="version-badge">v...</span></div>
    <div id="status" class="status" role="status">Verbinde...</div>
  </header>
  <main>
    <p id="connectionInfo" class="connection-info" role="status"></p>
    <section class="panel chooser" aria-label="Tag-Verwaltung">
      <div id="tagChooser" class="tag-manager">
        <div class="tag-manager-head">
          <div><h1>KI-Tag-Taxonomie</h1><p>Deutsche Immich-Tags und englische SigLIP2-Prompts direkt aus der JSON-Datei verwalten.</p></div>
          <div class="tag-manager-save"><span id="tagDirtyState">Gespeichert</span><button id="tagReloadBtn" class="btn ghost" type="button">Neu laden</button><button id="tagSaveBtn" class="btn" type="button" disabled>JSON speichern</button></div>
        </div>
        <div class="tag-manager-meta"><span id="tagStats"></span><code id="tagSourcePath"></code></div>
        <div class="tag-toolbar"><input id="tagSearch" type="search" placeholder="Tags, Pfade oder Prompts suchen…"><button id="tagAddFolderBtn" class="btn ghost" type="button">+ Kategorie</button><button id="tagAddBtn" class="btn" type="button">+ Tag</button></div>
        <div class="tag-admin-layout">
          <aside class="tag-tree-panel"><div class="tag-tree-help">Per Drag & Drop auf eine Kategorie verschieben</div><div id="tagTree" class="tag-tree"></div></aside>
          <section id="tagDetails" class="tag-details"></section>
        </div>
      </div>

    </section>
  </main>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
